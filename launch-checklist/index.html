<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Launch Checklist</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <h1>Team Launch Checklist</h1>
        <p class="subtitle">Track everything from kickoff to launch day.</p>
      </div>
      <button id="resetButton" class="ghost-button" type="button">Reset checklist</button>
    </header>

    <section class="overall" aria-label="Overall progress">
      <div class="overall-head">
        <strong>Overall progress</strong>
        <span id="overallCount" class="meta"></span>
      </div>
      <div class="progress">
        <div id="overallBar" class="progress-fill"></div>
      </div>
    </section>

    <div class="filters">
      <label class="toggle">
        <input type="checkbox" id="hideDone">
        Hide completed items
      </label>
    </div>

    <div id="sections" class="sections"></div>

    <p id="status" class="meta status" role="status" aria-live="polite"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
