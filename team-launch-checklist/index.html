<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Launch Checklist</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <h1>Team Launch Checklist</h1>
        <p class="subtitle">Track launch tasks from planning to launch day. Progress is saved in this browser.</p>
      </div>
      <button type="button" id="resetButton" class="secondary">Reset checklist</button>
    </header>

    <section class="overall" aria-live="polite">
      <div class="progress-label">
        <span>Overall progress</span>
        <span id="overallText">0 of 0 done</span>
      </div>
      <progress id="overallProgress" value="0" max="1"></progress>
    </section>

    <div id="sections" class="sections"></div>
  </main>

  <template id="sectionTemplate">
    <section class="section">
      <div class="section-header">
        <h2></h2>
        <span class="count"></span>
      </div>
      <ul class="items"></ul>
      <form class="add-form">
        <label class="visually-hidden">Add a task</label>
        <input type="text" placeholder="Add a task" required>
        <button type="submit">Add</button>
      </form>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
