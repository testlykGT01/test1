<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard filter regression tests</title>
  <link rel="stylesheet" href="../src/styles.css">
</head>
<body>
  <main class="shell">
    <h1>Dashboard filter regression tests</h1>
    <p id="test-results" role="status">Running tests…</p>
    <label for="priorityFilter">Priority</label>
    <select id="priorityFilter">
      <option value="all">All</option>
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
    <label for="statusFilter">Status</label>
    <select id="statusFilter">
      <option value="all">All</option>
      <option value="Planned">Planned</option>
      <option value="In Progress">In Progress</option>
      <option value="Backlog">Backlog</option>
    </select>
    <section id="cards" class="cards" aria-live="polite"></section>
  </main>
  <script src="../src/app.js"></script>
  <script src="filters.test.js"></script>
</body>
</html>
